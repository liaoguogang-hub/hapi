# Gradle
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# Local build versioning (see ../LOCAL-BUILD.md).
#
# hapiVersionName  -> shown in the app; upstream release string + local marker.
# hapiVersionCode  -> Android install key; must exceed every installed build.
#                     Upstream's latest Play build is 298943510, so local builds
#                     take 298943511, 298943512, ... in the same upstream series.
hapiVersionName=0.34.3+local.2
hapiVersionCode=298943512
